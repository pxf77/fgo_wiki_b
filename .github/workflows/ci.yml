name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Verify explicit version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm version:check -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: pnpm data:prepare:fixture
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm snapshot:build
      - run: pnpm build
      - run: pnpm --filter @fgo-wiki/mobile verify:embedded
      - uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: apps/web/out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-static
          path: apps/mobile/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cn-snapshot
          path: |
            data/generated/
            data/reports/cn-class-catalog.json
          if-no-files-found: error
