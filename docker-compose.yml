services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fgo_wiki
      POSTGRES_USER: fgo_wiki
      POSTGRES_PASSWORD: fgo_wiki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fgo_wiki -d fgo_wiki"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-fgo-wiki-api:local}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATA_SOURCE: snapshot
      SNAPSHOT_PATH: /workspace/data/generated/latest/snapshot.json
      DATABASE_URL: postgres://fgo_wiki:fgo_wiki@postgres:5432/fgo_wiki
      CORS_ORIGIN: http://localhost:3000,http://localhost:4173
    ports:
      - "3001:3001"
    volumes:
      - ./data/generated:/workspace/data/generated:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${WORKER_IMAGE:-fgo-wiki-worker:local}
    environment:
      NODE_ENV: production
      SNAPSHOT_OUTPUT_DIR: /workspace/data/generated
      ATLAS_CN_SERVANTS_URL: https://api.atlasacademy.io/export/CN/nice_servant.json
      ATLAS_RAW_PATH: /workspace/data/raw/atlas-cn/nice_servant.json
      ATLAS_CANDIDATE_PATH: /workspace/data/staged/atlas-cn/servant-candidates.json
      REVIEWED_SERVANTS_PATH: /workspace/data/normalized/cn/servants.reviewed.json
    volumes:
      - ./data:/workspace/data
    profiles: ["tools"]

volumes:
  postgres_data:
